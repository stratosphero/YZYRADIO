<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YZY RADIO</title>
  <link rel="shortcut icon" href="yzyradio.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="yzyradio.png">
  <link rel="apple-touch-icon" sizes="152x152" href="yzyradio.png">
  <link rel="apple-touch-icon" sizes="120x120" href="yzyradio.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <img src="yzyradioo.png" alt="YZY RADIO" style="width: 120px; height: auto; padding: 6px; cursor: pointer;"
       onclick="location.reload();">
</header>
  <main>
    <div class="albums" id="albumsContainer"></div>
  </main>
  <div class="player" id="player">
    <div class="player-top">
      <img id="playerCover" alt="Album cover">
      <div class="tracklist-mini" id="tracklistMini"></div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 18V6h2v12H6zm3-6l12 6V6l-12 6z"/></svg>
      </button>
      <button id="play" aria-label="Play or pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M16 6v12h-2V6h2zm-3 6L1 6v12l12-6z"/></svg>
      </button>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume control">
      <button id="shuffle" aria-label="Shuffle playlist">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 .39 12.5H0V14h.391a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 3.75zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 0 0 .39 3.5z"/>
          <path d="m7.5 10.723.98-1.167.957 1.14a2.25 2.25 0 0 0 1.724.804h1.947l-1.017-1.018a.75.75 0 1 1 1.06-1.06l2.829 2.828-2.829 2.828a.75.75 0 1 1-1.06-1.06L13.109 13H11.16a3.75 3.75 0 0 1-2.873-1.34l-.787-.938z"/>
        </svg>
      </button>
      <button id="bonusButton" aria-label="Bonus features">Bonus</button>
    </div>
    <div class="progress-bar" id="progressBar">
      <div class="progress" id="progress"></div>
      <div class="progress-dot" id="progressDot"></div>
    </div>
    <div class="time-stamps">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>
  <audio id="audio"></audio>
  <script src="main.js" defer></script>
</body>
</html>
